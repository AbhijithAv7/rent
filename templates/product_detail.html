{% extends "base.html" %}

{% block code %}

<div class="container mt-4">
    <div class="row">

        <div class="col-md-6">
            <img src="{{ dress.image.url }}" class="img-fluid custom-img">
        </div>

        <div class="col-md-6">
            <h2>{{ dress.name }}</h2>
            <h4>₹<span id="price">{{ dress.price_per_day }}</span> / day</h4>
            <p>{{ dress.description }}</p>

            <!-- Rent Form -->
            <form method="POST">
                {% csrf_token %}

                <label><strong>Select Days:</strong></label>
                <input type="number" id="days" name="days" value="1" min="1" class="form-control w-50 mb-3">

                <h4>Total: ₹<span id="total">{{ dress.price_per_day }}</span></h4>

                <input type="hidden" name="total_price" id="total_input">

                <div class="mt-3 d-flex gap-2">
                    <a href="{% url 'payment' %}" class="btn btn-dark">Rent Now</a>

                    <a href="{% url 'add_to_cart' dress.id %}" class="btn btn-outline-dark">
                    Add to Cart
                    </a>
                </div>
        </div>

    </div>
</div>

<script>
    const price = parseFloat(document.getElementById("price").innerText);
    const daysInput = document.getElementById("days");
    const total = document.getElementById("total");
    const totalInput = document.getElementById("total_input");

    function updateTotal() {
        let days = parseInt(daysInput.value) || 1;
        let totalPrice = price * days;

        total.innerText = totalPrice;
        totalInput.value = totalPrice;
    }

    daysInput.addEventListener("input", updateTotal);
    updateTotal();
</script>

{% endblock %}
