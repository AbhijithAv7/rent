{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block link %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">

    <a class="navbar-brand" href="{% url 'home' %}">Rent</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

      <!-- Left Side -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link active" href="{% url 'home' %}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url "products" %}">Products</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url "cart" %}">Cart</a>
        </li>



      </ul>


      <!-- Right Side -->
      <div class="d-flex align-items-center ms-auto">

        <!-- Search -->
        <form class="d-flex" method="GET" action="{% url 'products' %}">
        <input class="form-control me-2" type="search" name="q" placeholder="Search dresses...">
        <button class="btn btn-outline-dark search-btn" type="submit">Search</button>
        </form>

        <!-- Account Dropdown -->
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              Account
            </a>

            <ul class="dropdown-menu dropdown-menu-end">
              {% if user.is_authenticated %}
                <li><a class="dropdown-item" href="{% url "profile" %}">Profile</a></li>
                <li><a class="dropdown-item" href="{% url "logout" %}">Logout</a></li>
              {% else %}
                <li><a class="dropdown-item" href="{% url "register" %}">Register</a></li>
                <li><a class="dropdown-item" href="{% url "login" %}">Login</a></li>
              {% endif %}
            </ul>

          </li>
        </ul>

      </div>

    </div>
  </div>
</nav>

<div class="main container mt-4">
    {% block code %}{% endblock %}
</div>


<footer class="bg-body-tertiary text-center mt-auto">
    <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
        © 2026 Rent
    </div>
</footer>

</body>
</html>
