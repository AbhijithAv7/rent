{% extends "base.html" %}

{% block code %}

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">
            <div class="card p-4 shadow-sm">

                <h3 class="text-center mb-3">Update Profile</h3>

                <form method="POST">
                    {% csrf_token %}

                    <!-- Username (readonly) -->
                    <input type="text" class="form-control mb-2"
                           value="{{ request.user.username }}" readonly>

                    <!-- Email (editable) -->
                    <input type="email" name="email" class="form-control mb-2"
                           value="{{ request.user.email }}">

                    <!-- Phone -->
                    <input type="text" name="phone" class="form-control mb-2"
                           value="{{ profile.phone }}" placeholder="Phone">

                    <!-- Address -->
                    <textarea name="address" class="form-control mb-3"
                              placeholder="Address">{{ profile.address }}</textarea>

                    <button class="btn btn-dark w-100">
                        Save Changes
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
